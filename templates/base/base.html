{% load static %}

<html lang="fa">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{% endblock %}</title>

  <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/fontawesome.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/swiper-bundle.css' %}">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/scope.css' %}">
  {% block extra_css %}{% endblock %}
</head>

<body class="{% block body_class %}{% endblock %}" id="{% block body_id %}{% endblock %}">
  <!-- start back to top -->
  <button onclick="topFunction()" id="myBtn"><i class="fa-solid fa-chevron-up"></i></button>
  <!-- end back to top -->

  {% include "partials/header.html" %}

  <main>
    {% block content %}{% endblock %}
  </main>

  {% include "partials/footer.html" %}

  {% include "partials/scripts.html" %}
  {% block extra_js %}{% endblock %}
</body>

</html>
